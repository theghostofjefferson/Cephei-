  <main id="main">
    <header class="page page-head">
      <h1>Write to us</h1>
      <p>Students, parents, teachers and anyone who would like to help.</p>
    </header>

    <section class="page sheet">
      <h2 class="margin">Your message</h2>
      <div class="body">
        <form class="form" id="contact-form" novalidate>
          <div class="field">
            <label for="who">I am a</label>
            <select id="who" name="who">
              <option>Student</option>
              <option>Parent</option>
              <option>Teacher or school</option>
              <option>Someone who wants to help</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="send" type="submit">Send message</button>
          <div class="form-msg" id="form-msg" role="status" hidden></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="page">
      <div class="brandline">CEPHEI &mdash; physics and astrophysics education</div>
      <nav aria-label="Footer"><a href="index.html">Home</a><a href="about.html">About</a><a href="programs.html">What we do</a><a href="contact.html">Write to us</a></nav>
      <div class="where" data-contact-email></div>
    </div>
  </footer>

  <script src="js/site.js"></script>
</body>
</html>
