<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get in touch | CEPHEI</title>
  <meta name="description" content="Contact CEPHEI as a student, parent, teacher or volunteer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="CEPHEI home">
        <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
          <circle cx="60" cy="60" r="46" stroke="currentColor" stroke-width="2.4" />
          <path d="M 15 74 C 10 56, 39 38, 72 32 C 92 28, 108 33, 106 44" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" />
          <line x1="56" y1="30" x2="41" y2="43" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" />
          <line x1="64" y1="30" x2="77" y2="39" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" />
          <line x1="39" y1="51" x2="48" y2="75" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" />
          <line x1="81" y1="47" x2="82" y2="70" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" />
          <line x1="55" y1="80" x2="76" y2="76" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" />
          <path d="M 106 44 C 104 58, 74 76, 40 81 C 23 83, 18 79, 15 74" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" />
          <circle cx="60" cy="27" r="3.4" fill="var(--accent)" />
          <circle cx="81" cy="42" r="3.1" fill="var(--accent)" />
          <circle cx="37" cy="47" r="3.1" fill="var(--accent)" />
          <circle cx="82" cy="75" r="3.4" fill="var(--accent)" />
          <circle cx="50" cy="80" r="3.1" fill="var(--accent)" />
        </svg>
        <span>CEPHEI</span>
      </a>
      <button class="menu-btn" id="menu-btn" type="button" aria-controls="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" /></svg>
        Menu
      </button>
    </div>
    <nav class="menu" id="menu" aria-label="Main">
      <div class="wrap"><a href="index.html">Home</a><a href="about.html">About</a><a href="programs.html">What we do</a><a href="contact.html" aria-current="page">Get in touch</a></div>
    </nav>
  </header>


  <main>
    <section class="page-title">
      <div class="wrap">
        <h1>Get in touch</h1>
        <p>Students, parents, teachers and anyone who wants to help: write to us.</p>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <form id="contact-form" novalidate>
          <div class="field">
            <label for="who">I am a</label>
            <select id="who" name="who">
              <option>Student</option>
              <option>Parent</option>
              <option>Teacher or school</option>
              <option>Someone who wants to help</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="btn" type="submit">Send message</button>
          <div class="form-msg" id="form-msg" role="status" hidden></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>CEPHEI &middot; Physics and astrophysics education</div>
      <nav aria-label="Footer"><a href="index.html">Home</a><a href="about.html">About</a><a href="programs.html">What we do</a><a href="contact.html">Get in touch</a></nav>
      <div data-contact-email></div>
    </div>
  </footer>

  <script src="js/site.js"></script>
</body>
</html>
